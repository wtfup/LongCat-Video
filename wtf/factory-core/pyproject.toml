[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wtf-factory-core"
version = "0.1.0"
description = "WTF Avatar Factory - job queue + orchestrator (W1, schema v1, dark by default)"
requires-python = ">=3.9"
dependencies = []          # runtime is stdlib-only; see requirements.txt

[project.scripts]
factoryctl = "factory_core.cli:main"

[tool.setuptools]
packages = ["factory_core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
