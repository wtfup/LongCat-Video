version: "1.0"
# W4 Content Brain — curated content library.
# Consumed by brain.py (briefs) and calendar.py (planning).
# Constrained YAML subset: block style only, no inline comments, no flow lists.

languages:
  - hi
  - en

format:
  aspect: "9:16"
  duration_s: 45
  video: "vertical reel / Shorts"
  max_hashtags: 12

core_hashtags:
  - "#WTF"
  - "#Shorts"
  - "#Reels"
  - "#VishalNigam"

brands:
  - id: wtf_gyms
    label: "WTF Gyms"
    hashtags:
      - "#WTFGyms"
      - "#WTF"
  - id: wtf_franchise
    label: "WTF Franchise"
    hashtags:
      - "#WTFFranchise"
      - "#FranchiseIndia"
  - id: everyday
    label: "EVRYDAY"
    hashtags:
      - "#EVRYDAY"
      - "#EVRYDAYFit"
  - id: reboot
    label: "Reboot"
    hashtags:
      - "#WTFReboot"
      - "#RebootYourself"
  - id: amplify
    label: "Amplify"
    hashtags:
      - "#AmplifyFitness"
  - id: wtf_academy
    label: "WTF Academy"
    hashtags:
      - "#WTFAcademy"
      - "#TrainerLife"
  - id: wtf_360
    label: "WTF 360"
    hashtags:
      - "#WTF360"
  - id: digiwtf
    label: "DigiWTF"
    hashtags:
      - "#DigiWTF"

rotation:
  weekly:
    monday: ai_systems
    tuesday: founder_journey
    wednesday: wtf_brands
    thursday: fitness_transformation
    friday: business
    saturday: fitness_transformation
    sunday: wtf_brands
  secondary:
    - ai_systems
    - wtf_brands
    - founder_journey
    - fitness_transformation
    - business

pillars:
  - id: ai_systems
    label: "AI Systems"
    label_hi: "AI सिस्टम्स"
    description_en: "How WTF runs on AI: agents in sales, support and ops, and what founders can copy."
    default_brand: wtf_gyms
    hook_templates_en:
      - "Nobody's telling you this about {topic_lc} —"
      - "{topic} — in 45 seconds."
      - "Your competitors already run this: {topic}"
      - "Stop scrolling. Here's why {topic_lc} changes your numbers."
    hook_templates_hi:
      - "{topic} — यह बात कोई नहीं बताता।"
      - "{topic} — 45 सेकंड में समझो।"
      - "आपके competitors यह पहले से चला रहे हैं: {topic}"
      - "रुको — {topic} आपके numbers क्यों बदलता है, देखो।"
    context_templates_en:
      - "Here's the difference between AI in a demo and AI in a real business —"
      - "The gap is never the tech. It's wiring it into daily operations —"
    context_templates_hi:
      - "Demo वाला AI और असली business वाला AI — फ़र्क़ यही है —"
      - "कमी tech की नहीं होती। कमी इसे रोज़ के काम में लगाने की होती है —"
    cta_templates_en:
      - "Follow for the real playbooks behind AI-run businesses."
      - "Comment “AI” and I'll share the exact stack we run."
      - "Save this before your competitor automates it first."
    cta_templates_hi:
      - "AI से चलने वाले businesses के असली playbooks — follow करो।"
      - "Comment करो “AI” — हमारा exact stack भेजूँगा।"
      - "Save कर लो, इससे पहले कि competitor automate करे।"
    hashtags:
      - "#AI"
      - "#AIAgents"
      - "#Automation"
      - "#AIIndia"
      - "#FitnessTech"
      - "#SpeedToLead"
      - "#FounderTools"
    thumbnail_concepts:
      - "Tight close-up on a dark background, headline in gold caps over a maroon gradient"
      - "Split frame: phone showing a new lead vs. Vishal talking straight to camera"
      - "Whiteboard frame: one number circled in gold, maroon accent light"
    expressions:
      - "confident, mid-sentence"
      - "deadpan, eyebrow raised"
    topics:
      - id: ai_systems-01
        title_en: "The AI receptionist that never sleeps"
        title_hi: "AI receptionist जो कभी नहीं सोता"
        angle_en: "Speed-to-lead is the whole game — the first reply wins the member."
        angle_hi: "Lead की speed ही पूरा game है — पहला जवाब देने वाले का member होता है।"
        points_en:
          - "A lead goes cold in minutes. Most gyms reply in hours."
          - "Our AI answers every enquiry under 60 seconds — 24×7, Hindi or English."
          - "AI qualifies and books. Trainers close. That split is the system."
        points_hi:
          - "Lead कुछ मिनटों में ठंडा हो जाता है, और ज़्यादातर gyms घंटों बाद जवाब देते हैं।"
          - "हमारा AI हर enquiry को 60 सेकंड के अंदर जवाब देता है — 24×7, हिंदी या English।"
          - "AI qualify करता है और booking कराता है। Trainer close करता है। यही system है।"
        proof_en: "We run this AI across our own gyms first — only then do we talk about it."
        proof_hi: "यह AI पहले हमारे ही gyms में चलता है — उसके बाद ही हम बात करते हैं।"
        props:
          - "phone screen lighting up with a new lead"
          - "reception desk wide shot, empty chair"
          - "split screen: chat thread to booked appointment"
          - "trainer greeting a member at the door"
        thumb_text: "REPLIES IN 60 SEC"
      - id: ai_systems-02
        title_en: "Your next employee won't be human"
        title_hi: "आपका अगला employee इंसान नहीं होगा"
        angle_en: "Founders are handing busywork to agent teams — and keeping humans for judgment."
        angle_hi: "Founders बिज़ी-वर्क agent teams को सौंप रहे हैं — और इंसान सिर्फ़ judgment के लिए रख रहे हैं।"
        points_en:
          - "Every founder drowns in follow-ups, reports and the same support questions."
          - "An AI ops team doesn't get tired, doesn't forget, doesn't need a weekend."
          - "Keep humans for judgment, relationships and the closing table."
        points_hi:
          - "हर founder follow-ups, reports और एक जैसे support सवालों में डूबा रहता है।"
          - "AI ops team थकती नहीं, भूलती नहीं, weekend की मोहताज नहीं होती।"
          - "इंसान judgment, रिश्तों और closing table के लिए रखो।"
        proof_en: "My agent stack runs sales follow-ups, support and content — every single day."
        proof_hi: "मेरा agent stack हर दिन sales follow-ups, support और content चलाता है।"
        props:
          - "laptop dashboard with a running task queue"
          - "phone notification stream timelapse"
          - "founder reviewing a screen late at night"
          - "coffee cup next to a blinking server light"
        thumb_text: "AI TEAM, 24×7"

  - id: founder_journey
    label: "Founder Journey"
    label_hi: "Founder का सफ़र"
    description_en: "The lessons, numbers and scars of building WTF — told straight, no highlight reel."
    default_brand: wtf_gyms
    hook_templates_en:
      - "{topic} — the part nobody posts."
      - "I paid for this lesson so you don't have to: {topic}"
      - "If you're building something, hear this: {topic}"
      - "The feed won't show you this: {topic}"
    hook_templates_hi:
      - "{topic} — वो हिस्सा जो कोई post नहीं करता।"
      - "यह सबक मैंने महँगा खरीदा है: {topic}"
      - "अगर तुम कुछ बना रहे हो, तो यह सुनो: {topic}"
      - "Feed तुम्हें यह नहीं दिखाएगा: {topic}"
    context_templates_en:
      - "Everybody shows the wins. Let me show you the months in between —"
      - "This part of the story never makes it to the feed —"
    context_templates_hi:
      - "सब जीत दिखाते हैं। मैं बीच के महीने दिखाता हूँ —"
      - "कहानी का यह हिस्सा कभी feed तक नहीं पहुँचता —"
    cta_templates_en:
      - "Follow — I post the real numbers and the real lessons."
      - "If this hit, share it with someone in the middle of their build."
      - "Save this for the day you want to quit."
    cta_templates_hi:
      - "Follow करो — मैं असली numbers और असली सबक post करता हूँ।"
      - "अगर बात लगी, तो किसी builder को भेजो।"
      - "इसे save कर लो — उस दिन के लिए जब छोड़ने का मन करे।"
