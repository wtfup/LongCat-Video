      - "#StartupIndia"
      - "#Entrepreneurship"
      - "#FounderLife"
      - "#BuildInPublic"
      - "#StartupLessons"
      - "#IndianStartups"
    thumbnail_concepts:
      - "Grainy early-days photo treatment with a gold caption strip"
      - "Desk at night: laptop glow, maroon wall behind"
      - "Close-up of a handwritten notebook, one line underlined in gold"
    expressions:
      - "honest, direct to lens"
      - "tired but smiling"
    topics:
      - id: founder_journey-01
        title_en: "The boring middle of building something big"
        title_hi: "कुछ बड़ा बनाने का boring middle"
        angle_en: "Everyone posts the start and the win. The middle is where it's actually won."
        angle_hi: "सब शुरुआत और जीत post करते हैं। असली जीत बीच के हिस्से में होती है।"
        points_en:
          - "Month six to month thirty-six is one long test of whether you keep showing up."
          - "No virality, no applause — just rent, payroll and another opening."
          - "The winners aren't the smartest people in the room. They're the ones still there."
        points_hi:
          - "महीना छह से महीना छत्तीस — बस एक लंबा इम्तिहान कि तुम आते रहते हो या नहीं।"
          - "ना viral, ना तालियाँ — बस rent, salary और अगली opening।"
          - "जीत सबसे तेज़ दिमाग़ की नहीं होती — उनकी होती है जो अब भी खड़े हैं।"
        proof_en: "I still do the boring parts myself — reviews, rosters, numbers."
        proof_hi: "मैं आज भी बोरिंग काम खुद करता हूँ — reviews, rosters, numbers।"
        props:
          - "empty gym at 5:30am as the lights come on"
          - "keys opening the shutter"
          - "whiteboard with the month plan"
          - "founder walking the floor alone"
        thumb_text: "THE MIDDLE WINS"
      - id: founder_journey-02
        title_en: "Hire slow, fire fast — the expensive lesson"
        title_hi: "Hire slow, fire fast — यह सबक महँगा पड़ा"
        angle_en: "One wrong hire doesn't just cost a salary — it costs every customer they touch."
        angle_hi: "एक गलत hire सिर्फ़ salary नहीं लेता — उन customers की कीमत भी लेता है जिन्हें वह छूता है।"
        points_en:
          - "A wrong hire in a leadership seat sets you back a year, not a month."
          - "Waiting 'one more quarter' makes it worse for everyone — including them."
          - "Standards are a system: write them, measure them, act on them fast."
        points_hi:
          - "Leadership seat पर एक गलत hire साल भर पीछे कर देता है — महीना नहीं।"
          - "'एक और quarter देख लेते हैं' — सबके लिए और बुरा करता है।"
          - "Standards एक system है: लिखो, नापो, और फ़ौरन लागू करो।"
        proof_en: "Every exit taught me something the interview missed. I fixed the interviews."
        proof_hi: "हर exit ने बताया interview में क्या छूटा। मैंने interviews ठीक किए।"
        props:
          - "interview table with two empty chairs"
          - "offer letter close-up"
          - "calendar pages flipping"
          - "one-on-one conversation across a desk"
        thumb_text: "FIRE FAST"

