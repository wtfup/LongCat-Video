    topics:
      - id: business-01
        title_en: "Unit economics: the one number that decides everything"
        title_hi: "Unit economics: वह एक number जो सब तय करता है"
        angle_en: "Growth without unit economics is just an expensive way to go out of business."
        angle_hi: "Unit economics के बिना growth — business बंद करने का महँगा तरीका है।"
        points_en:
          - "Know what one customer costs you and what one customer gives you."
          - "If that gap is negative, no amount of hustle fixes the math."
          - "Fix margins first, scale second — never the other way around."
        points_hi:
          - "जानो एक customer कितने का पड़ता है और कितना देता है।"
          - "अगर gap negative है, कोई hustle maths नहीं ठीक कर सकता।"
          - "पहले margin ठीक करो, फिर scale — कभी उल्टा नहीं।"
        proof_en: "Every WTF vertical gets reviewed on margin per member, per month."
        proof_hi: "हर WTF vertical की समीक्षा margin per member, per month पर होती है।"
        props:
          - "calculator and notebook with two numbers beside it"
          - "blurred dashboard on a screen"
          - "founder whiteboarding CAC vs LTV"
          - "walk-in shot with a footfall counter"
        thumb_text: "FIX THE MATH"
      - id: business-02
        title_en: "Culture is a system — incentives decide behavior"
        title_hi: "Culture एक system है — incentives behaviour तय करते हैं"
        angle_en: "Your team doesn't do what you say. They do what gets rewarded."
        angle_hi: "टीम वो नहीं करती जो तुम कहते हो। वो करती है जिसका reward मिलता है।"
        points_en:
          - "Change the incentive and the behaviour changes within one cycle."
          - "Vague goals create vague effort. Scoreboards create clarity."
          - "Design for the floor: simple numbers your people can win every week."
        points_hi:
          - "Incentive बदलो — behaviour एक cycle में बदल जाता है।"
          - "धुँधले goals से धुँधली मेहनत आती है। Scoreboard साफ़ियत देता है।"
          - "Floor के लिए design करो: ऐसे numbers जो हर हफ़्ते जीते जा सकें।"
        proof_en: "We run weekly scoreboard incentives across our clubs — and we publish them."
        proof_hi: "हम clubs में हर हफ़्ते scoreboard incentives चलाते हैं — और publish करते हैं।"
        props:
          - "leaderboard on a screen above the floor"
          - "whiteboard with weekly targets"
          - "team huddle on the gym floor"
          - "recognition moment with applause"
        thumb_text: "REWARD DRIVES"
